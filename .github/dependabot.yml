version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; bump manually once it supports 7.
      - dependency-name: typescript
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Types match the oldest supported Node.js (engines >= 22.12), so APIs missing there fail typecheck.
      # Bump the major only together with "engines".
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
